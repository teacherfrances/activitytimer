:root{
  --fs:28px;
  --ink:#0B2A4A; --grey:#4A6378; --line:#BAE4F0;
  --easy:#0091B9; --easyt:#E6F4FA; --easyd:#00708F;
  --medium:#FF6500; --mediumt:#FFF0E0; --mediumd:#B34700;
  --hard:#004E9B; --hardt:#E1ECF7; --hardd:#003A75;
  --display:"Outfit","Segoe UI Black","Arial Black","Segoe UI",Carlito,Calibri,system-ui,sans-serif;
  --body:"Figtree",Calibri,Carlito,"Segoe UI",Candara,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html{background:#0091B9;min-height:100%}
body{margin:0;font-family:var(--body);font-weight:600;font-size:var(--fs);color:var(--ink);line-height:1.3;min-height:100vh;position:relative;
  padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 7% 22%, #BAE4F0 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 94% 14%, #FFE27A 0, #FF6500 85px, transparent 86px),
    radial-gradient(circle at 88% 82%, #5FB8D6 0, #004E9B 130px, transparent 131px),
    radial-gradient(circle at 12% 88%, #5FB8D6 0, #004E9B 110px, transparent 111px),
    radial-gradient(circle at 48% 92%, #FFE27A 0, #FF6500 70px, transparent 71px),
    radial-gradient(circle at 78% 46%, #FFE27A 0, #FF6500 30px, transparent 31px),
    radial-gradient(circle at 55% 60%, rgba(255,255,255,.10) 0, rgba(255,255,255,.10) 240px, transparent 241px),
    radial-gradient(rgba(255,255,255,.45) 2.5px, transparent 3px),
    linear-gradient(135deg,#004E9B 0%,#0091B9 40%,#0091B9 80%,#BAE4F0 100%);
  background-size:auto,auto,auto,auto,auto,auto,auto,64px 64px,auto}
button{font:inherit;font-size:1em;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:5px solid #FFD500;outline-offset:3px}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none!important}

/* ===== top bar ===== */
.top{position:sticky;top:0;z-index:10;padding:calc(.3em + env(safe-area-inset-top,0px)) .6em .3em;color:#fff;
  display:flex;align-items:center;gap:.5em;flex-wrap:wrap;
  background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:2px solid rgba(255,255,255,.35);box-shadow:0 8px 30px rgba(0,40,90,.18)}
.brand{display:flex;align-items:center;gap:.35em;margin-right:auto;flex-wrap:wrap}
.logo{font-size:1.25em}
.top h1{margin:0;font-family:var(--display);font-weight:700;font-size:1.15em;text-shadow:0 3px 10px rgba(0,40,90,.25)}
.top h1 .the{background:#FF6500;padding:.02em .3em .08em;border-radius:6px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.top h1 .seat{color:#FFD500;text-shadow:0 3px 0 rgba(160,60,0,.35)}
.tbtn{min-height:64px;min-width:64px;padding:0 .55em;border-radius:14px;border:3px solid rgba(255,255,255,.6);background:rgba(255,255,255,.16);color:#fff;font-weight:800}
.tbtn[aria-pressed="true"]{background:#fff;color:#E05500;border-color:#fff}
.sizes{display:flex;gap:.25em}
.sizes .tbtn{font-family:var(--display);font-weight:700;padding:0 .35em}

main{max-width:1500px;margin:0 auto;padding:.8em .8em 2em}
.card{background:#fff;border-radius:26px;box-shadow:0 18px 40px rgba(0,40,90,.22);padding:.7em .8em .8em}
.stack{display:grid;gap:.8em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.ct{font-family:var(--display);font-weight:700;margin:0 0 .45em;font-size:1em;color:var(--ink);display:flex;align-items:center;gap:.3em;flex-wrap:wrap}
.ct .n{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;
  background:linear-gradient(135deg,#FF8A00,#FF6500);color:#fff;font-size:.8em;flex:none}
.opts{display:flex;flex-wrap:wrap;gap:.4em}
.opt{min-height:68px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.opt[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#004E9B);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(0,78,155,.3)}
.opt.lv-easy[aria-pressed="true"]{background:linear-gradient(135deg,#0091B9,#0091B9)}
.opt.lv-medium[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FFD500)}
.opt.lv-hard[aria-pressed="true"]{background:linear-gradient(135deg,#004E9B,#FF6500)}
.small{min-height:58px;padding:0 .6em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B;font-size:.75em}
.tchips{display:flex;flex-wrap:wrap;gap:.4em}
.tchip{min-height:64px;padding:0 .7em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B;display:inline-flex;align-items:center;gap:.3em}
.tchip .cnt{font-size:.68em;background:#E6F4FA;color:#004E9B;border-radius:999px;padding:0 .45em}
.tchip[aria-pressed="true"]{background:linear-gradient(135deg,#004E9B,#0091B9);border-color:transparent;color:#fff}
.tchip[aria-pressed="true"] .cnt{background:rgba(255,255,255,.3);color:#fff}
.tchip.settle[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FF6500)}
.group{margin:.5em 0 .3em;font-family:var(--display);font-weight:700;font-size:.85em;display:flex;align-items:center;gap:.4em;flex-wrap:wrap}
.group .mini{margin-left:auto;display:flex;gap:.3em}
.sub{color:var(--grey);font-size:.82em;margin:.45em 0 0;font-weight:700}
.toggle{min-height:64px;padding:0 .75em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.toggle[aria-pressed="true"]{background:linear-gradient(135deg,#FF6500,#FFD500);color:#fff;border-color:transparent}
.go{min-height:84px;padding:0 1.1em;border:0;border-radius:999px;color:#fff;font-family:var(--display);font-weight:700;font-size:1.1em;
  background:linear-gradient(135deg,#FF8A00,#FF6500 50%,#0091B9);box-shadow:0 6px 0 #B34700,0 14px 28px rgba(255,101,0,.35)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #B34700}
.plain{min-height:64px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.blue{min-height:64px;padding:0 .9em;border-radius:999px;border:0;color:#fff;font-weight:800;background:linear-gradient(135deg,#004E9B,#0091B9);box-shadow:0 5px 0 #003A75}
.bar{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
.match{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;justify-content:space-between}
.match b{font-family:var(--display);font-weight:700;color:#FF6500}
.meter{height:.55em;border-radius:999px;background:#E6F4FA;margin:.5em 0 0;overflow:hidden}
.meter span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FF8A00,#FF6500 55%,#0091B9)}
.custom{display:flex;align-items:center;gap:.5em;flex-wrap:wrap;margin-top:.6em}
.custom .lab{font-weight:800;color:var(--grey);font-size:.85em}
.stepper{display:inline-flex;align-items:center;gap:.25em;background:#E6F4FA;border-radius:999px;padding:.2em .3em}
.stepper button{min-width:64px;height:64px;padding:0 .3em;border-radius:999px;border:3px solid var(--line);background:#fff;font-family:var(--display);font-weight:700;color:#004E9B}
.stepper .v{min-width:2.2em;text-align:center;font-family:var(--display);font-weight:700;font-size:1.15em;border-radius:999px;padding:.05em .3em}
.stepper .v.on{background:linear-gradient(135deg,#0091B9,#004E9B);color:#fff}
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,11em),1fr));gap:.5em;margin-top:.6em}
.teamrow{display:flex;gap:.4em;align-items:center;border-radius:18px;padding:.25em .4em;background:#F2FAFD}
.sw{width:.9em;height:.9em;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff}
.teamrow input{flex:1;min-width:0;font:inherit;font-size:1em;font-weight:800;padding:.15em .45em;border:3px solid var(--line);border-radius:14px;color:var(--ink);min-height:60px;background:#fff}
.names{width:100%;margin-top:.5em;font:inherit;font-size:1em;font-weight:800;color:var(--ink);background:#F2FAFD;border:3px solid var(--line);border-radius:18px;padding:.35em .55em;min-height:6.5em;resize:vertical;line-height:1.35}

/* chips */
.chips{display:flex;gap:.35em;flex-wrap:wrap;justify-content:center}
.chip{font-size:.7em;font-weight:800;border-radius:999px;padding:.15em .65em;background:#E6F4FA;color:#004E9B}
.chip.settle{background:#FFF0E0;color:#B34700}
.chip.lv{background:var(--lt);color:var(--ld)}
.lv-easy{--lc:var(--easy);--lt:var(--easyt);--ld:var(--easyd)}
.lv-medium{--lc:var(--medium);--lt:var(--mediumt);--ld:var(--mediumd)}
.lv-hard{--lc:var(--hard);--lt:var(--hardt);--ld:var(--hardd)}



/* ===== puzzle ===== */
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif;font-weight:400}
.puz{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.15em .3em;margin:.2em 0 .1em}
.puz .pe{font-size:4.6em;line-height:1.1}
.puz .pl{font-family:var(--display);font-weight:700;font-size:4.2em;line-height:1;color:var(--ink)}
.puz .plus{font-family:var(--display);font-weight:700;font-size:3em;color:#FF6500;line-height:1}
.pcard .puz{min-height:3.4em;margin-top:.5em}
.gallery .puz .pe{font-size:2.2em} .gallery .puz .pl{font-size:2em} .gallery .puz .plus{font-size:1.6em}
@media (max-width:640px){ .puz .pe{font-size:2.4em} .puz .pl{font-size:2.1em} .puz .plus{font-size:1.7em} }
.label{font-family:var(--display);font-weight:700;font-size:1.25em;margin:.2em 0 0}
.qhead{display:flex;align-items:center;gap:.6em;flex-wrap:wrap;color:#fff;font-weight:800;text-shadow:0 2px 6px rgba(0,40,90,.35)}
.qhead .pill{background:#fff;color:var(--ink);text-shadow:none;border-radius:999px;padding:.1em .7em;font-family:var(--display);font-weight:700}
.dots{display:flex;gap:.3em;flex-wrap:wrap}
.dots span{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.5)}
.dots span.on{background:#fff;box-shadow:0 0 0 3px #FF6500}
.dots span.done{background:#FFE27A}
.playrow{display:grid;grid-template-columns:1fr auto;gap:.8em;align-items:start;margin-top:.6em}
@media (max-width:900px){.playrow{grid-template-columns:1fr}}
.pcard{text-align:center;padding:.8em .8em 1em;border-top:16px solid #FF6500;position:relative;overflow:hidden}
.pcard::after{content:"";position:absolute;width:7em;height:7em;border-radius:50%;right:-2.5em;bottom:-3em;background:radial-gradient(circle at 35% 35%,#FFE27A,#FF6500);opacity:.16;pointer-events:none}
.hintbox{margin-top:.6em;display:grid;gap:.45em;position:relative;z-index:1}
.hint{background:#F2FAFD;border-radius:20px;padding:.4em .6em;font-weight:800}
.hint b{font-family:var(--display);font-weight:700;color:#004E9B}
.blanks{font-family:var(--num,monospace);font-family:Consolas,"Lucida Console","DejaVu Sans Mono",monospace;letter-spacing:.25em;font-size:1.3em;font-weight:700;color:var(--ink)}
.answer{margin-top:.6em;background:linear-gradient(135deg,#16A34A,#4ADE80);color:#fff;border-radius:24px;padding:.35em .6em;position:relative;z-index:1;
  font-family:var(--display);font-weight:700;font-size:1.9em;box-shadow:0 14px 30px rgba(22,163,74,.35)}
.answer small{display:block;font-family:var(--body);font-weight:800;font-size:.42em;opacity:.95}
.side{display:flex;flex-direction:column;gap:.6em;min-width:9.5em}
.timerbox{position:relative;width:4.2em;height:4.2em;align-self:center}
.timerbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.timerbox .track{stroke:#E6F4FA}
.timerbox .tt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:1.05em}
.timerbox .tt small{font-family:var(--body);font-size:.5em;color:var(--grey);font-weight:800}
.timerbox.low .tt{color:#E11D48}
.hbtn{min-height:64px;padding:0 .8em;border-radius:999px;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}
.hbtn[aria-pressed="true"]{background:#E6F4FA;border-color:#0091B9}
.who{margin-top:.7em;position:relative;z-index:1}
.who h3{margin:0 0 .4em;font-family:var(--display);font-weight:700;font-size:.9em}
.tms{display:grid;gap:.5em;grid-template-columns:repeat(auto-fill,minmax(min(100%,8.5em),1fr))}
.tm{min-height:78px;border-radius:22px;border:4px solid #fff;background:#F2FAFD;box-shadow:0 8px 18px rgba(0,40,90,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;padding:.2em;font-weight:800}
.tm .nm{display:flex;align-items:center;gap:.3em;font-family:var(--display);font-weight:700}
.tm .st{font-size:.7em;color:var(--grey)}
.tm[aria-pressed="true"]{background:linear-gradient(135deg,#16A34A,#4ADE80);color:#fff}
.tm[aria-pressed="true"] .st{color:#fff}
.nav{display:flex;gap:.6em;justify-content:space-between;flex-wrap:wrap;margin-top:.8em}

/* ===== gallery ===== */
.gallery{display:grid;gap:.7em;grid-template-columns:repeat(auto-fill,minmax(min(100%,11.5em),1fr));margin-top:.8em}
.ghead{grid-column:1/-1;margin:.8em 0 0;padding:.35em .7em;border-radius:14px;background:#004E9B;color:#fff;font-family:Outfit,sans-serif;font-size:1.05em;display:flex;align-items:center;gap:.4em}.ghead .cnt{margin-left:auto;background:#FFD500;color:#003A75;border-radius:999px;padding:0 .55em;font-size:.8em}.ghead:first-child{margin-top:0}
.gcard{background:#fff;border:0;border-radius:24px;box-shadow:0 14px 30px rgba(0,40,90,.22);padding:.5em .5em .6em;text-align:center;display:flex;flex-direction:column;gap:.2em;min-height:9em;justify-content:center}
.gcard .label{font-size:.8em;color:var(--grey)}
.gcard .ga{font-family:var(--display);font-weight:700;color:#16A34A;font-size:1.05em}
.gcard .gh{font-size:.72em;color:#004E9B;font-weight:800}
.gcard .tap{font-size:.65em;color:#8FB9CC;font-weight:800}

/* ===== end ===== */
.scorelist{display:grid;gap:.55em}
.srow{display:flex;align-items:center;gap:.6em;background:#fff;border-radius:24px;padding:.4em .7em;box-shadow:0 12px 26px rgba(0,40,90,.2)}
.srow.first{background:linear-gradient(135deg,#FFF8D6,#FFF1B8)}
.srow .rk{font-size:1.3em;width:1.6em;text-align:center;font-family:var(--display);font-weight:700}
.srow .nm{flex:1;font-family:var(--display);font-weight:700;display:flex;align-items:center;gap:.35em}
.srow .tot{font-family:var(--display);font-weight:700;font-size:1.4em;min-width:2em;text-align:right}
.srow .adj{display:flex;gap:.25em}
.srow .adj button{width:56px;height:56px;border-radius:50%;border:3px solid var(--line);background:#fff;font-weight:800;color:#004E9B}

@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.35) both}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
}
@media (max-width:640px){
  .top{position:static}
  main{padding:.5em .45em 2em}
  .go{width:100%}
}
/* ===== phone fix: nothing wider than the screen, no sideways wobble ===== */
html,body{max-width:100%;overflow-x:hidden}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior-x:none;touch-action:manipulation}
.stack{grid-template-columns:minmax(0,1fr)}
.stack>*,.grid2>*,.card{min-width:0}
.card,.sub,.count{overflow-wrap:break-word}
.letterset{overflow-wrap:anywhere;word-break:break-all}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){
  .stepper{display:flex;width:100%;max-width:26em}
  .stepper button{flex:1 1 0;min-width:0;padding:0}
  .stepper .v{flex:1.2 1 0;min-width:0}
  .custom{flex-direction:column;align-items:stretch}
}
/* ===== phone fix 2: wrap long words and buttons on small screens ===== */
@media (max-width:640px){
  body{font-size:min(var(--fs), 8.5vw)}
  .top h1{font-size:clamp(20px, 6.6vw, 1.15em);overflow-wrap:anywhere}
  .brand{min-width:0;max-width:100%}
  button{max-width:100%}
  .opt,.plain,.blue,.toggle,.go,.small,.hbtn,.tchip,.chip,.tm,.seg button,.tab,.desk,.person,.pchip{white-space:normal;overflow-wrap:anywhere;height:auto}
  .tchip{text-align:left}
  .playrow,.qrow,.roundtop,.tiles,.qlist,.results,.review,.gallery,.cats,.tms{grid-template-columns:minmax(0,1fr)}
  .tile,.answer,.qcard h2,.pcard,.qi .qt,.cat .txt,.bigcat h2,.pickbox,.why,.hint,.label,.checkhead,.qhead,.roundinfo,.ga,.gh{overflow-wrap:anywhere;min-width:0}
  .bt summary{flex-wrap:wrap}
  .cat,.qi .top2,.qi .foot{flex-wrap:wrap}
  .letter{margin:0 auto}
}

/* ===== ACTIVITY TIMER ===== */
.tabs{display:flex;flex-wrap:wrap;gap:.4em;align-items:center;margin:.2em 0 .8em}
.tabs .opt{background:#fff}
.tabs .opt[aria-pressed="true"]{background:#FFD500 !important;color:#0B2A4A !important;border-color:#FFD500 !important;box-shadow:0 8px 18px rgba(0,30,70,.3) !important}
.minirun{margin-left:auto;min-height:56px;padding:0 .8em;border-radius:999px;border:0;background:#FFD500;color:#0B2A4A;font-weight:800;font-size:.8em;box-shadow:0 6px 16px rgba(0,40,90,.25);font-variant-numeric:tabular-nums}
.center{text-align:center}
.lbl{display:block;font-family:var(--display);font-weight:700;margin:0 0 .3em}
.lbl small{font-family:var(--body);font-weight:700;color:var(--grey);font-size:.7em}
input.txt{width:100%;min-height:64px;border:3px solid var(--line);border-radius:18px;padding:.2em .55em;font:inherit;font-size:.95em;color:var(--ink);background:#fff;min-width:0}
input.txt:focus,input.mini:focus,input.digit:focus{outline:5px solid #FFD500;outline-offset:2px;border-color:#0091B9}
input.mini{width:2.6em;min-height:60px;border:3px solid var(--line);border-radius:16px;padding:0 .2em;font:inherit;font-family:var(--display);font-weight:700;text-align:center;color:#004E9B;background:#fff;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input.mini::-webkit-outer-spin-button,input.mini::-webkit-inner-spin-button,input.digit::-webkit-outer-spin-button,input.digit::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* quick timer editor */
.tcard{max-width:1100px;margin:0 auto}
.setTime{display:flex;align-items:center;justify-content:center;gap:.05em;margin:.35em auto .15em;font-family:var(--display);font-weight:700;color:#004E9B;
  font-size:clamp(70px, 16vw, 210px);line-height:1}
.setTime .colon{padding-bottom:.08em}
input.digit{width:2.1ch;border:0;border-bottom:5px solid #BAE4F0;background:transparent;font:inherit;color:inherit;text-align:center;padding:0;border-radius:0;height:1.08em;line-height:1;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
input.digit.w1{width:1.15ch}
input.digit.m3{width:3.1ch}
.adj,.presets{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;margin:.6em 0}
.chipb{min-height:64px;padding:0 .9em;border-radius:999px;border:0;background:#D8F0F7;color:#004E9B;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.chipb.minus{background:#FFE6D5;color:#B34700}
.chipb.clear{background:#fff;border:3px solid var(--line)}
.presets .chipb{background:#fff;border:3px solid var(--line)}
.presets .chipb[aria-pressed="true"]{background:#004E9B;color:#fff;border-color:#004E9B}
.go.big{width:100%;min-height:96px;font-size:1.25em;margin-top:.4em}
/* plan editor */
.plangrid{display:grid;gap:.8em;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);align-items:start}
.rows{display:grid;gap:.5em}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:.45em;align-items:center;background:#F3FAFD;border-radius:20px;padding:.4em .5em}

.row .rbtns{display:flex;gap:.25em}
.row .rlow{display:contents}

.ib:disabled{opacity:.3;cursor:default}
.ib.del{color:#B34700}
.empty{background:#F3FAFD;border:3px dashed var(--line);border-radius:20px;padding:1em;text-align:center;color:var(--grey);font-weight:700}
.addrow{margin-top:.6em}
.common{display:flex;flex-wrap:wrap;gap:.4em}
.common .chipb{background:#fff;border:3px solid var(--line);font-family:var(--body);font-weight:800;font-size:.85em}
.common .chipb .t{color:var(--grey);font-size:.85em;margin-left:.2em}
.toggles{display:grid;gap:.4em}
.toggles .toggle{text-align:left;padding:.3em .8em;height:auto;min-height:64px}
.summary{background:linear-gradient(135deg,#004E9B,#0091B9);color:#fff;border-radius:22px;padding:.6em .8em;margin-bottom:.6em}
.summary .tot{font-family:var(--display);font-weight:700;font-size:1.3em;font-variant-numeric:tabular-nums}
.summary .fin{font-weight:700;font-size:.8em;opacity:.95}
.saved{display:grid;gap:.4em;margin-top:.5em}
.saved .sv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.35em;align-items:center;background:#F3FAFD;border-radius:18px;padding:.3em .3em .3em .7em}
.saved .sv b{overflow-wrap:anywhere;font-size:.9em}
.saved .sv small{display:block;color:var(--grey);font-size:.72em;font-weight:700}
.saverow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.4em}
.note{color:var(--grey);font-size:.75em;font-weight:700;margin:.4em 0 0}
.warnbtn{color:#B34700 !important;border-color:#FFB98A !important}

.rungrid.withlist{grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)}
.runcard{text-align:center;position:relative;overflow:hidden;--c:#0091B9}

.runtop{display:flex;justify-content:space-between;align-items:center;gap:.4em;flex-wrap:wrap;margin-top:.3em}
.stepchip,.finchip{border-radius:999px;padding:.1em .7em;font-weight:800;font-size:.72em}
.stepchip{background:#004E9B;color:#fff}
.finchip{background:#E6F4FA;color:#004E9B;font-variant-numeric:tabular-nums}
.actname{font-family:var(--display);font-weight:700;font-size:clamp(28px, 4.2vw, 1.6em);margin:.25em 0 .1em;overflow-wrap:anywhere;line-height:1.15}
.ringbox{position:relative;width:min(78vw, 56vh, 620px);aspect-ratio:1/1;margin:.2em auto .3em}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ringbox .trk{fill:none;stroke:#E6F4FA;stroke-width:16}
.ringbox .prg{fill:none;stroke:var(--c);stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset .25s linear, stroke .4s}
.ringbox .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigtime{font-family:var(--display);font-weight:700;color:#0B2A4A;font-size:clamp(56px, min(17vw, 13vh), 190px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bigtime.long{font-size:clamp(44px, min(12vw, 10vh), 150px)}
.overtxt{min-height:1.2em;color:#B34700;font-weight:800;font-size:.8em;font-variant-numeric:tabular-nums}
.paused .bigtime{opacity:.45}
.pausedtag{display:none;margin-top:.2em;background:#FFD500;color:#0B2A4A;border-radius:999px;padding:.05em .7em;font-weight:800;font-size:.75em}
.paused .pausedtag{display:inline-block}
.upmsg{display:none;font-family:var(--display);font-weight:700;font-size:1.4em;color:#B34700;margin:.1em 0 .2em}
.s-up .upmsg,.s-end .upmsg{display:block}
.s-up .ringbox,.s-end .ringbox{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@media (prefers-reduced-motion:reduce){.s-up .ringbox,.s-end .ringbox{animation:none}}
.nextline{font-weight:800;color:var(--grey);font-size:.85em;margin:.1em 0 .4em;overflow-wrap:anywhere}
.nextline b{color:#004E9B}
.ctrls{display:grid;gap:.5em;margin-top:.4em}

.ctrlrow .plain{min-width:0}
.steps{display:grid;gap:.35em}
.step{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.45em;align-items:center;padding:.35em .55em;border-radius:16px;background:#F3FAFD;font-weight:700;font-size:.85em}
.step .dot{width:1.5em;height:1.5em;border-radius:50%;display:grid;place-items:center;background:#BAE4F0;color:#004E9B;font-size:.8em;font-weight:800}

.step .stm{font-variant-numeric:tabular-nums;color:var(--grey)}
.step.done{opacity:.55}
.step.done .dot{background:#0091B9;color:#fff}
.step.now{background:#FFF3D1;outline:3px solid #FFD500}
.step.now .dot{background:#FF6500;color:#fff}
button.step{width:100%;height:auto;min-height:56px;border:0;cursor:pointer;font:inherit;font-weight:700;color:inherit}
/* stopwatch */
.watch{font-family:var(--display);font-weight:700;color:#004E9B;font-size:clamp(64px, 15vw, 200px);line-height:1;margin:.3em 0 .2em;font-variant-numeric:tabular-nums}
.watch small{font-size:.45em;color:var(--grey)}
.laps{display:grid;gap:.3em;margin-top:.6em;text-align:left}
.lap{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.6em;padding:.3em .7em;border-radius:14px;background:#F3FAFD;font-weight:700;font-size:.85em;font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:60;max-width:min(92vw,30em);
  background:#003A75;color:#fff;border:3px solid #FFD500;border-radius:20px;padding:.4em .9em;font-weight:800;font-size:.8em;text-align:center;
  box-shadow:0 14px 30px rgba(0,20,50,.4);transition:transform .25s ease;pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.runwarn{background:#FFF1E6;color:#8A3A00;border:3px solid #FFB98A;border-radius:18px;padding:.4em .7em;font-weight:800;font-size:.8em;margin:.6em 0 0;display:flex;align-items:center;gap:.5em;flex-wrap:wrap}
.runwarn .small{margin-left:auto}
@media (max-width:900px){
  .plangrid,.rungrid.withlist{grid-template-columns:minmax(0,1fr)}
}

  .row{grid-template-columns:auto minmax(0,1fr);}

}

<body>
<header class="top">
  <div class="brand"><span class="logo emo">⏱️</span><h1><span class="the">Activity</span> <span class="seat">Timer</span></h1></div>
  <a class="tbtn homebtn" id="toolkitHome" href="Teachers_Toolkit_Home.html" aria-label="Back to the Teacher's Toolkit">🏠<span class="hbtxt"> Toolkit</span></a>
  <div class="sizes" role="group" aria-label="Text size">
    <button class="tbtn" data-size="28" aria-label="Small text" aria-pressed="true" style="font-size:.7em">A</button>
    <button class="tbtn" data-size="34" aria-label="Medium text" aria-pressed="false" style="font-size:.85em">A</button>
    <button class="tbtn" data-size="42" aria-label="Large text" aria-pressed="false">A</button>
  </div>
  <button class="tbtn" data-act="sound" id="soundBtn" aria-label="Sound on or off">🔊</button>
  <button class="tbtn" data-act="fs">Full screen</button>
</header>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY = "activity-timer-v1";
  var COMMON = [
    ["👋","Warm-up",5],["💬","Pair talk",3],["👥","Group work",10],["📖","Reading",10],
    ["✍️","Writing",15],["🎧","Listening",10],["🗣️","Speaking practice",5],["📝","Quiz",10],
    ["🎲","Class game",10],["☕","Break",15],["🔁","Review",5],["🧹","Pack up",3]
  ];
  var PRESETS = [1,2,3,5,10,15,20,30];
  var S = {
    size: 28, sound: true, tab: "timer",
    quick: {name: "", secs: 300},
    plan: [{e:"👋",name:"Warm-up",secs:300},{e:"💬",name:"Pair talk",secs:180},{e:"👥",name:"Group work",secs:600}],
    plans: [], auto: true, warn: true,
    run: null,
    watch: {running: false, startAt: 0, acc: 0, laps: []}
  };
  var confirmKey = null, confirmTimer = null;

  /* ---------- storage ---------- */
  function load(){
    try{
      var s = JSON.parse(localStorage.getItem(KEY) || "null");
      if(s && typeof s === "object"){
        if([28,34,42].indexOf(s.size) > -1) S.size = s.size;
        if(typeof s.sound === "boolean") S.sound = s.sound;
        if(["timer","plan","watch"].indexOf(s.tab) > -1) S.tab = s.tab;
        if(s.quick && typeof s.quick.secs === "number") S.quick = {name: String(s.quick.name || "").slice(0, 60), secs: clampSecs(s.quick.secs)};
        if(Array.isArray(s.plan)) S.plan = cleanItems(s.plan);
        if(Array.isArray(s.plans)) S.plans = s.plans.filter(function(p){ return p && typeof p.name === "string" && Array.isArray(p.items); })
          .map(function(p){ return {name: p.name.slice(0, 40), items: cleanItems(p.items)}; }).slice(0, 30);
        if(typeof s.auto === "boolean") S.auto = s.auto;
        if(typeof s.warn === "boolean") S.warn = s.warn;
        if(s.watch && typeof s.watch.acc === "number") S.watch = {running: !!s.watch.running, startAt: +s.watch.startAt || 0, acc: Math.max(0, s.watch.acc), laps: Array.isArray(s.watch.laps) ? s.watch.laps.filter(function(x){ return typeof x === "number"; }).slice(0, 99) : []};
        if(s.run && Array.isArray(s.run.items) && s.run.items.length){
          var r = s.run;
          r.items = cleanItems(r.items);
          var stale = r.endAt && Date.now() - r.endAt > 10 * 60 * 1000;
          if(r.items.length && !stale && typeof r.idx === "number" && r.idx >= 0 && r.idx < r.items.length) S.run = r;
        }
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
  function cleanItems(a){
    return a.filter(function(x){ return x && typeof x === "object"; }).map(function(x){
      return {e: typeof x.e === "string" ? x.e.slice(0, 8) : "", name: String(x.name || "").slice(0, 60), secs: clampSecs(+x.secs || 0)};
    }).slice(0, 40);
  }
  var MAXSECS = 3 * 3600, MAXROWS = 40;
  function clampSecs(n){ n = Math.round(+n || 0); return Math.max(0, Math.min(n, MAXSECS)); }

  /* ---------- helpers ---------- */
  function esc(t){ return String(t).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function fmt(secs){
    secs = Math.max(0, Math.ceil(secs - 1e-6));
    var h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
    return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
  }
  function fmtUp(secs){
    secs = Math.max(0, Math.floor(secs));
    var h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60;
    return h ? h + ":" + pad(m) + ":" + pad(s) : m + ":" + pad(s);
  }
  function words(secs){
    secs = Math.round(secs);
    var h = Math.floor(secs / 3600), m = Math.floor(secs % 3600 / 60), s = secs % 60, out = [];
    if(h) out.push(h + (h === 1 ? " hour" : " hours"));
    if(m) out.push(m + (m === 1 ? " minute" : " minutes"));
    if(s) out.push(s + (s === 1 ? " second" : " seconds"));
    return out.length ? out.join(" ") : "0 minutes";
  }
  function clock(ms){
    var d = new Date(ms), h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "pm" : "am";
    h = h % 12 || 12;
    return h + ":" + pad(m) + " " + ap;
  }
  function total(items){ return items.reduce(function(a, x){ return a + x.secs; }, 0); }
  function label(x){ return (x.e ? x.e + " " : "") + (x.name.trim() || "Activity"); }

  /* ---------- sound ---------- */
  var actx = null;
  function unlockAudio(){
    try{
      if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if(actx.state === "suspended") actx.resume();
    }catch(e){}
  }
  function tone(freq, start, dur, type, vol){
    if(!S.sound) return;
    try{
      unlockAudio(); if(!actx) return;
      var t = actx.currentTime + (start || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.05);
    }catch(e){}
  }
  /* sounds booked ahead on the audio clock, so they play on time even if the browser slows the page down in the background */
  var sched = [];
  function cancelSched(){ sched.forEach(function(o){ try{ o.stop(0); }catch(e){} }); sched = []; if(S.run) S.run.sched = false; }
  function toneAt(freq, when, dur, type, vol){
    try{
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, when);
      g.gain.setValueAtTime(0.0001, when); g.gain.linearRampToValueAtTime(vol || 0.25, when + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
      o.connect(g); g.connect(actx.destination); o.start(when); o.stop(when + dur + 0.05); sched.push(o);
    }catch(e){}
  }
  function scheduleRun(){
    cancelSched();
    var R = S.run;
    if(!S.sound || !R || R.phase !== "run" || !R.endAt) return;
    unlockAudio();
    if(!actx || actx.state !== "running") return;
    var left = (R.endAt - Date.now()) / 1000; if(left <= 0.05) return;
    var base = actx.currentTime, k, r;
    for(k = 3; k >= 1; k--) if(left - k > 0.05) toneAt(880, base + left - k, 0.12, "triangle", 0.18);
    if(S.warn && !R.warned && R.dur > 120 && left > 60.2){ toneAt(523, base + left - 60, 0.25, "sine", 0.22); toneAt(523, base + left - 59.68, 0.25, "sine", 0.22); }
    var seq = [784, 988, 1175];
    for(r = 0; r < 3; r++) for(k = 0; k < 3; k++) toneAt(seq[k], base + left + r * 0.9 + k * 0.17, 0.45, "triangle", 0.3);
    R.sched = true;
  }
  function sTick(){ tone(880, 0, 0.12, "triangle", 0.18); }
  function sWarn(){ tone(523, 0, 0.25, "sine", 0.22); tone(523, 0.32, 0.25, "sine", 0.22); }
  function sStart(){ tone(523, 0, 0.14, "triangle", 0.2); tone(784, 0.15, 0.22, "triangle", 0.22); }
  function sEnd(){
    var seq = [784, 988, 1175], k;
    for(var r = 0; r < 3; r++) for(k = 0; k < 3; k++) tone(seq[k], r * 0.9 + k * 0.17, 0.45, "triangle", 0.3);
  }
  function sDone(){ var seq = [523, 659, 784, 1047]; for(var k = 0; k < 4; k++) tone(seq[k], k * 0.16, 0.5, "triangle", 0.3); tone(1047, 0.8, 0.9, "sine", 0.25); }

  /* ---------- keep the screen awake while a timer runs ---------- */
  var lock = null;
  function wantAwake(){ return !!(S.run && S.run.phase === "run" && S.run.endAt) || !!S.watch.running; }
  function updateWake(){
    try{
      if(wantAwake()){
        if(!lock && navigator.wakeLock && document.visibilityState === "visible"){
          navigator.wakeLock.request("screen").then(function(l){ lock = l; l.addEventListener("release", function(){ lock = null; }); }).catch(function(){});
        }
      } else if(lock){ lock.release().catch(function(){}); lock = null; }
    }catch(e){}
  }
  document.addEventListener("visibilitychange", function(){ updateWake(); tick(); });

  /* ---------- running a timer ---------- */
  function startRun(mode, items, idx){
    unlockAudio(); cancelSched();
    S.run = {mode: mode, items: items.map(function(x){ return {e: x.e || "", name: x.name, secs: x.secs}; }), idx: idx || 0, phase: "run", endAt: 0, left: 0, dur: 0, overAt: 0, gapEnd: 0, warned: false, lastTick: -1};
    beginItem(S.run.idx, true);
  }
  function beginItem(i, first){
    var R = S.run; R.idx = i; R.phase = "run"; R.dur = Math.max(1, R.items[i].secs); R.left = R.dur;
    R.endAt = Date.now() + R.dur * 1000; R.overAt = 0; R.gapEnd = 0; R.warned = false; R.lastTick = -1;
    sStart(); scheduleRun();
    save(); updateWake(); render();
  }
  function remaining(){
    var R = S.run; if(!R) return 0;
    if(R.phase !== "run") return 0;
    return R.endAt ? Math.max(0, (R.endAt - Date.now()) / 1000) : R.left;
  }
  function hasNext(){ return S.run && S.run.mode === "plan" && S.run.idx < S.run.items.length - 1; }
  function finishItem(){
    var R = S.run;
    R.overAt = R.endAt || Date.now(); R.endAt = 0; R.left = 0;
    var booked = R.sched; sched = []; R.sched = false;
    if(R.mode === "plan" && !hasNext()){ R.phase = "end"; sDone(); if(!booked) sEnd(); }
    else { R.phase = "up"; if(!booked) sEnd(); if(R.mode === "plan" && S.auto) R.gapEnd = Date.now() + 6000; }
    save(); updateWake(); render();
  }
  function pause(){ var R = S.run; if(!R || R.phase !== "run" || !R.endAt) return; R.left = remaining(); R.endAt = 0; cancelSched(); save(); updateWake(); render(); }
  function resume(){ var R = S.run; if(!R || R.phase !== "run" || R.endAt) return; unlockAudio(); R.endAt = Date.now() + R.left * 1000; scheduleRun(); save(); updateWake(); render(); }
  function addTime(sec){
    var R = S.run; if(!R) return;
    if(R.phase === "up" || R.phase === "end"){
      R.phase = "run"; R.dur = sec; R.left = sec; R.endAt = Date.now() + sec * 1000; R.gapEnd = 0; R.warned = true; R.lastTick = -1; R.overAt = 0;
    } else if(R.endAt){ R.endAt += sec * 1000; R.dur = Math.max(R.dur, remaining()); }
    else { R.left += sec; R.dur = Math.max(R.dur, R.left); }
    scheduleRun(); save(); updateWake(); render();
  }
  function stopRun(){ cancelSched(); S.run = null; save(); updateWake(); render(); }

  var lastSecShown = -1;
  function tick(){
    var R = S.run, now = Date.now();
    if(R){
      if(R.phase === "run" && R.endAt){
        var left = (R.endAt - now) / 1000;
        if(left <= 0){ finishItem(); return; }
        var whole = Math.ceil(left);
        if(whole <= 3 && whole !== R.lastTick){ R.lastTick = whole; if(!R.sched) sTick(); }
        if(S.warn && !R.warned && R.dur > 120 && left <= 60){ R.warned = true; if(!R.sched) sWarn(); save(); }
      }
      if(R.phase === "up" && R.gapEnd && now >= R.gapEnd){ R.gapEnd = 0; beginItem(R.idx + 1); return; }
    }
    paint();
  }
  setInterval(tick, 200);

  /* ---------- painting live numbers without rebuilding the page ---------- */
  var C = 2 * Math.PI * 90;
  function paint(){
    var R = S.run;
    var mini = document.getElementById("miniRun");
    if(mini){
      if(R && !onRunTab()){
        mini.style.display = "";
        mini.textContent = (R.phase === "run" ? "⏱️ " + fmt(remaining()) : R.phase === "end" ? "🎉 Done" : "⏰ Time's up") + "  ·  " + (R.items[R.idx].name.trim() || "Activity") + "  ▶";
      } else mini.style.display = "none";
    }
    if(R && onRunTab()){
      var card = document.getElementById("runCard"); if(!card) return;
      var left = remaining(), frac = R.phase === "run" ? Math.max(0, Math.min(1, left / R.dur)) : 1;
      var st = R.phase === "up" ? "s-up" : R.phase === "end" ? "s-end" : (left <= 10 ? "s-last" : (left <= 60 || frac <= .25) ? "s-low" : "s-ok");
      card.className = "card runcard " + st + (R.phase === "run" && !R.endAt ? " paused" : "");
      var t = document.getElementById("rTime");
      var txt = R.phase === "run" ? fmt(left) : "0:00";
      if(t.textContent !== txt){ t.textContent = txt; t.className = "bigtime" + (txt.length > 5 ? " long" : ""); }
      document.getElementById("rRing").style.strokeDashoffset = (C * (1 - frac)).toFixed(1);
      var ov = document.getElementById("rOver");
      ov.textContent = (R.phase === "up" || R.phase === "end") && R.overAt ? "Over by " + fmtUp((Date.now() - R.overAt) / 1000) : "";
      var fin = document.getElementById("rFin");
      if(fin){
        var restSecs = (R.phase === "run" ? left : 0) + R.items.slice(R.idx + 1).reduce(function(a, x){ return a + x.secs; }, 0);
        fin.textContent = (R.mode === "plan" ? "Plan ends at " : "Ends at ") + clock(Date.now() + restSecs * 1000);
      }
      var gap = document.getElementById("rGap");
      if(gap) gap.textContent = R.gapEnd ? Math.max(1, Math.ceil((R.gapEnd - Date.now()) / 1000)) : "";
    }
    var w = document.getElementById("wTime");
    if(w){ var e = watchSecs(); w.innerHTML = fmtUp(e) + "<small>." + Math.floor(e * 10 % 10) + "</small>"; }
  }
  function onRunTab(){ var R = S.run; return R && ((R.mode === "quick" && S.tab === "timer") || (R.mode === "plan" && S.tab === "plan")); }

  /* ---------- stopwatch ---------- */
  function watchSecs(){ var W = S.watch; return (W.acc + (W.running ? Date.now() - W.startAt : 0)) / 1000; }

  /* ---------- rendering ---------- */
  var app = document.getElementById("app");
  function tabs(){
    var t = [["timer","⏱️ Timer"],["plan","📋 Activity plan"],["watch","⏲️ Stopwatch"]];
    return '<div class="tabs" role="tablist">' + t.map(function(x){
      return '<button class="opt" role="tab" data-act="tab" data-v="' + x[0] + '" aria-pressed="' + (S.tab === x[0]) + '">' + x[1] + "</button>";
    }).join("") + '<button class="minirun" id="miniRun" data-act="goRun" style="display:none"></button></div>';
  }
  function render(){
    document.documentElement.style.setProperty("--fs", S.size + "px");
    document.querySelectorAll("[data-size]").forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.size === S.size ? "true" : "false"); });
    var sb = document.getElementById("soundBtn"); sb.textContent = S.sound ? "🔊" : "🔇"; sb.setAttribute("aria-pressed", S.sound ? "true" : "false");
    var h = tabs();
    if(onRunTab()) h += runView();
    else if(S.tab === "timer") h += timerView();
    else if(S.tab === "plan") h += planView();
    else h += watchView();
    var wasRun = app.getAttribute("data-run") === "1", isRun = onRunTab() ? "1" : "0";
    app.innerHTML = h; app.setAttribute("data-run", isRun);
    if(isRun === "1" && !wasRun) try{ window.scrollTo(0, 0); }catch(e){}
    sizeDigits();
    paint();
  }

  function timerView(){
    var s = S.quick.secs, m = Math.floor(s / 60), sec = s % 60;
    var h = '<div class="card tcard">' +
      '<label class="lbl" for="qName">What are we doing? <small>(you can leave this empty)</small></label>' +
      '<input class="txt" id="qName" maxlength="60" autocomplete="off" placeholder="For example: Talk with your group" value="' + esc(S.quick.name) + '">' +
      '<div class="setTime" aria-label="Time">' +
        '<input class="digit' + (m > 99 ? " m3" : "") + '" id="qMin" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Minutes" value="' + m + '">' +
        '<span class="colon">:</span>' +
        '<input class="digit" id="qSec" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Seconds" value="' + pad(sec) + '">' +
      "</div>" +
      '<p class="sub center">Tap the numbers to type a time, or use the buttons.</p>' +
      '<div class="adj">' +
        '<button class="chipb minus" data-act="qAdd" data-v="-60">−1:00</button>' +
        '<button class="chipb" data-act="qAdd" data-v="30">+0:30</button>' +
        '<button class="chipb" data-act="qAdd" data-v="60">+1:00</button>' +
        '<button class="chipb" data-act="qAdd" data-v="300">+5:00</button>' +
        '<button class="chipb clear" data-act="qSet" data-v="0">Clear</button>' +
      "</div>" +
      '<div class="presets">' + PRESETS.map(function(p){
        return '<button class="chipb" data-act="qSet" data-v="' + p * 60 + '" aria-pressed="' + (s === p * 60) + '">' + p + " min</button>";
      }).join("") + "</div>" +
      (S.run && S.run.mode === "plan" ? '<p class="runwarn">⚠️ Your activity plan is still running. Starting this timer will stop the plan. <button class="small" data-act="goRun">Go back to the plan</button></p>' : "") +
      '<button class="go big" data-act="qStart"' + (s > 0 ? "" : " disabled") + ">" + (S.run && S.run.mode === "plan" ? "▶ Start (stops the plan)" : "▶ Start") + "</button>" +
      "</div>";
    return h;
  }

  function planView(){
    var P = S.plan, tot = total(P);
    var rows = P.length ? P.map(function(x, i){
      var m = Math.floor(x.secs / 60), s = x.secs % 60;
      return '<div class="row">' +
        '<span class="num">' + (i + 1) + "</span>" +
        '<input class="txt" data-f="name" data-i="' + i + '" maxlength="60" autocomplete="off" aria-label="Activity ' + (i + 1) + ' name" placeholder="Type the activity" value="' + esc((x.e ? x.e + " " : "") + x.name) + '">' +
        '<span class="rlow"><span class="rtime"><input class="mini" data-f="min" data-i="' + i + '" inputmode="numeric" pattern="[0-9]*" maxlength="3" aria-label="Activity ' + (i + 1) + ' minutes" value="' + m + '"> min ' +
        '<input class="mini" data-f="sec" data-i="' + i + '" inputmode="numeric" pattern="[0-9]*" maxlength="2" aria-label="Activity ' + (i + 1) + ' seconds" value="' + pad(s) + '"> sec</span>' +
        '<span class="rbtns"><button class="ib" data-act="up" data-i="' + i + '" aria-label="Move up"' + (i ? "" : " disabled") + ">▲</button>" +
        '<button class="ib" data-act="down" data-i="' + i + '" aria-label="Move down"' + (i < P.length - 1 ? "" : " disabled") + ">▼</button>" +
        '<button class="ib del" data-act="del" data-i="' + i + '" aria-label="Delete this activity">✕</button></span></span>' +
        "</div>";
    }).join("") : '<div class="empty">No activities yet. Tap a common activity, or tap "Add an activity".</div>';

    var left = '<div class="card"><h2 class="ct"><span class="n">1</span>Your activities</h2>' +
      '<div class="rows" id="rows">' + rows + "</div>" +
      '<div class="ctrlrow addrow" style="justify-content:flex-start"><button class="blue" data-act="addRow"' + (P.length >= MAXROWS ? " disabled" : "") + '>➕ Add an activity</button>' +
      (P.length ? '<button class="plain warnbtn" data-act="clearPlan">' + (confirmKey === "clearPlan" ? "⚠️ Tap again to clear" : "🗑️ Clear the list") + "</button>" : "") + "</div>" +
      '<p class="note">' + (P.length >= MAXROWS ? "You have " + MAXROWS + " activities. That is the most one plan can hold." : "Type each activity and its time. Use ▲ ▼ to change the order.") + "</p>" +
      '<h2 class="ct" style="margin-top:.8em"><span class="n">2</span>Add a common activity</h2>' +
      '<div class="common">' + COMMON.map(function(c, k){
        return '<button class="chipb" data-act="common" data-k="' + k + '"' + (P.length >= MAXROWS ? " disabled" : "") + '>' + c[0] + " " + c[1] + '<span class="t">' + c[2] + " min</span></button>";
      }).join("") + "</div></div>";

    var right = '<div class="stack">' +
      '<div class="card"><div class="summary"><div class="tot" id="pTot">' + words(tot) + '</div><div class="fin" id="pFin">' +
        (P.length ? P.length + (P.length === 1 ? " activity" : " activities") + ". If you start now, you finish at " + clock(Date.now() + tot * 1000) + "." : "Add activities to see the total time.") + "</div></div>" +
      (S.run && S.run.mode === "quick" ? '<p class="runwarn">⚠️ The quick timer is still running. Starting the plan will stop it. <button class="small" data-act="goRun">Go back to the timer</button></p>' : "") +
      '<button class="go big" data-act="pStart"' + (P.length && tot > 0 ? "" : " disabled") + ">" + (S.run && S.run.mode === "quick" ? "▶ Start the plan (stops the timer)" : "▶ Start the plan") + "</button>" +
      '<h2 class="ct" style="margin-top:.8em"><span class="n">3</span>Options</h2>' +
      '<div class="toggles">' +
        '<button class="toggle" data-act="auto" aria-pressed="' + S.auto + '">' + (S.auto ? "✅" : "⬜") + " Start the next activity by itself</button>" +
        '<button class="toggle" data-act="warn" aria-pressed="' + S.warn + '">' + (S.warn ? "✅" : "⬜") + " Soft beep 1 minute before the end</button>" +
      "</div></div>" +
      '<div class="card"><h2 class="ct"><span class="n">4</span>Saved plans</h2>' +
        '<div class="saverow"><input class="txt" id="planName" maxlength="40" autocomplete="off" placeholder="Name, e.g. Monday class"><button class="blue" data-act="savePlan"' + (P.length ? "" : " disabled") + ">💾 Save</button></div>" +
        '<div class="saved">' + (S.plans.length ? S.plans.map(function(p, k){
          return '<div class="sv"><div><b>' + esc(p.name) + "</b><small>" + p.items.length + (p.items.length === 1 ? " activity" : " activities") + " · " + words(total(p.items)) + "</small></div>" +
            '<button class="small" data-act="loadPlan" data-k="' + k + '">📂 Open</button>' +
            '<button class="small warnbtn" data-act="delPlan" data-k="' + k + '">' + (confirmKey === "delPlan" + k ? "⚠️ Sure?" : "🗑️") + "</button></div>";
        }).join("") : '<p class="note" style="margin:0">Save a plan here to use it again next lesson.</p>') + "</div>" +
      "</div></div>";
    return '<div class="plangrid">' + left + right + "</div>";
  }

  function runView(){
    var R = S.run, it = R.items[R.idx], plan = R.mode === "plan", nxt = hasNext() ? R.items[R.idx + 1] : null;
    var running = R.phase === "run" && R.endAt;
    var body = '<div class="ringbox"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="90"></circle>' +
      '<circle class="prg" id="rRing" cx="100" cy="100" r="90" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="0"></circle></svg>' +
      '<div class="inner"><div class="bigtime" id="rTime" aria-live="off">' + fmt(remaining()) + '</div><div class="overtxt" id="rOver"></div><span class="pausedtag">⏸ Paused</span></div></div>';
    var ctr = '<div class="ctrls">';
    if(R.phase === "run"){
      ctr += running ? '<button class="go big" data-act="pause">⏸ Pause</button>' : '<button class="go big" data-act="resume">▶ Keep going</button>';
      ctr += '<div class="ctrlrow">' +
        (plan ? '<button class="plain" data-act="back"' + (R.idx ? "" : " disabled") + '>⏮ Back</button>' : "") +
        '<button class="plain" data-act="add" data-v="30">+30 sec</button><button class="plain" data-act="add" data-v="60">+1 min</button>' +
        '<button class="plain" data-act="restart">↺ Restart</button>' +
        (plan ? '<button class="plain" data-act="next">' + (nxt ? "⏭ Next" : "⏭ Finish") + "</button>" : "") +
        '<button class="plain warnbtn" data-act="stop">⏹ Stop</button></div>';
    } else if(R.phase === "up"){
      if(plan && nxt){
        if(R.gapEnd) ctr += '<p class="nextline">Next: <b>' + esc(label(nxt)) + "</b> starts in <b id=\"rGap\"></b>…</p>" +
          '<button class="go big" data-act="next">▶ Start now: ' + esc(nxt.name.trim() || "next activity") + '</button><div class="ctrlrow"><button class="plain" data-act="hold">✋ Wait</button>';
        else ctr += '<button class="go big" data-act="next">▶ Start next: ' + esc(nxt.name.trim() || "next activity") + '</button><div class="ctrlrow">';
        ctr += '<button class="plain" data-act="add" data-v="60">+1 min more</button><button class="plain warnbtn" data-act="stop">⏹ Stop the plan</button></div>';
      } else {
        ctr += '<button class="go big" data-act="again">↺ Same again</button><div class="ctrlrow"><button class="plain" data-act="add" data-v="60">+1 min more</button><button class="plain" data-act="stop">✅ Done</button></div>';
      }
    } else {
      ctr += '<button class="go big" data-act="replan">↺ Start the plan again</button><div class="ctrlrow"><button class="plain" data-act="add" data-v="60">+1 min more</button><button class="plain" data-act="stop">✏️ Back to the plan</button></div>';
    }
    ctr += "</div>";
    var msg = '<div class="upmsg">' + (R.phase === "end" ? "🎉 All done! Great work." : "⏰ Time's up!") + "</div>";
    var top = '<div class="runtop"><span class="stepchip">' + (plan ? "Activity " + (R.idx + 1) + " of " + R.items.length : "Timer") + '</span><span class="finchip" id="rFin"></span></div>';
    var name = '<h2 class="actname">' + esc(it.name.trim() ? label(it) : (plan ? label(it) : "⏱️ Timer")) + "</h2>";
    var nextline = plan && R.phase === "run" ? '<p class="nextline">' + (nxt ? "Next up: <b>" + esc(label(nxt)) + "</b> (" + fmt(nxt.secs) + ")" : "This is the last activity.") + "</p>" : "";
    var card = '<div class="card runcard" id="runCard">' + top + name + '<div class="runbody"><div>' + body + "</div><div>" + msg + nextline + ctr + "</div></div></div>";
    if(!plan) return '<div class="rungrid">' + card + "</div>";
    var list = '<div class="card"><h2 class="ct">📋 The plan</h2><div class="steps">' + R.items.map(function(x, i){
      var cls = i < R.idx || (i === R.idx && R.phase === "end") ? "done" : i === R.idx ? "now" : "";
      return '<button class="step ' + cls + '" data-act="jump" data-i="' + i + '" aria-label="Go to ' + esc(label(x)) + '"><span class="dot">' + (cls === "done" ? "✓" : i + 1) + '</span><span class="snm">' + esc(label(x)) + '</span><span class="stm">' + fmt(x.secs) + "</span></button>";
    }).join("") + '</div><p class="note">Tap an activity to jump to it.</p></div>';
    return '<div class="rungrid withlist">' + card + list + "</div>";
  }

  function watchView(){
    var W = S.watch, e = watchSecs();
    var laps = W.laps.slice().map(function(t, i, a){ return {n: i + 1, t: t, d: t - (i ? a[i - 1] : 0)}; }).reverse();
    return '<div class="card tcard center"><h2 class="ct" style="justify-content:center">⏲️ Stopwatch</h2>' +
      '<div class="watch" id="wTime">' + fmtUp(e) + "<small>.0</small></div>" +
      (W.running ? '<button class="go big" data-act="wPause">⏸ Pause</button>' : '<button class="go big" data-act="wStart">▶ ' + (e > 0 ? "Keep going" : "Start") + "</button>") +
      '<div class="ctrlrow" style="margin-top:.5em"><button class="plain" data-act="wLap"' + (W.running ? "" : " disabled") + '>🚩 Lap</button><button class="plain" data-act="wReset"' + (e > 0 || W.running ? "" : " disabled") + ">↺ Reset</button></div>" +
      (laps.length ? '<div class="laps">' + laps.map(function(l){ return '<div class="lap"><b>Lap ' + l.n + '</b><span class="lt">+' + fmtUp(l.d) + "</span><span>" + fmtUp(l.t) + "</span></div>"; }).join("") + "</div>" : "") +
      "</div>";
  }

  /* ---------- typing in times and names ---------- */
  function num(v, max){ v = parseInt(String(v).replace(/[^0-9]/g, ""), 10); if(isNaN(v)) v = 0; return Math.min(v, max); }
  function splitEmoji(text){
    var m = /^\s*([\uD800-\uDBFF][\uDC00-\uDFFF](?:️)?|[☀-➿](?:️)?)\s+(.*)$/.exec(text);
    return m ? {e: m[1], name: m[2]} : {e: "", name: text};
  }
  function readQuickTime(){
    var mi = document.getElementById("qMin"), si = document.getElementById("qSec"); if(!mi || !si) return;
    S.quick.secs = clampSecs(num(mi.value, 999) * 60 + num(si.value, 999));
    save();
    var st = document.querySelector('[data-act="qStart"]'); if(st) st.disabled = S.quick.secs <= 0;
    sizeDigits();
    document.querySelectorAll('.presets [data-act="qSet"]').forEach(function(b){ b.setAttribute("aria-pressed", +b.dataset.v === S.quick.secs ? "true" : "false"); });
  }
  function sizeDigits(){
    var mi = document.getElementById("qMin"); if(!mi) return;
    var n = String(mi.value).length;
    mi.classList.toggle("w1", n <= 1); mi.classList.toggle("m3", n >= 3);
  }
  function updatePlanSummary(){
    var tot = total(S.plan), P = S.plan;
    var a = document.getElementById("pTot"), b = document.getElementById("pFin"), st = document.querySelector('[data-act="pStart"]');
    if(a) a.textContent = words(tot);
    if(b) b.textContent = P.length ? P.length + (P.length === 1 ? " activity" : " activities") + ". If you start now, you finish at " + clock(Date.now() + tot * 1000) + "." : "Add activities to see the total time.";
    if(st) st.disabled = !(P.length && tot > 0);
  }
  app.addEventListener("input", function(e){
    var t = e.target;
    if(t.id === "qName"){ S.quick.name = t.value.slice(0, 60); save(); return; }
    if(t.id === "qMin" || t.id === "qSec"){ t.value = t.value.replace(/[^0-9]/g, ""); readQuickTime(); return; }
    if(t.dataset && t.dataset.f){
      var i = +t.dataset.i, x = S.plan[i]; if(!x) return;
      if(t.dataset.f === "name"){ var sp = splitEmoji(t.value); x.e = sp.e; x.name = sp.name.slice(0, 60); }
      else {
        t.value = t.value.replace(/[^0-9]/g, "");
        var row = t.closest(".row"), mi = row.querySelector('[data-f="min"]'), si = row.querySelector('[data-f="sec"]');
        x.secs = clampSecs(num(mi.value, 999) * 60 + num(si.value, 999));
      }
      save(); updatePlanSummary();
    }
  });
  app.addEventListener("change", function(e){
    var t = e.target;
    if(t.id === "qMin" || t.id === "qSec"){
      readQuickTime();
      var mi = document.getElementById("qMin"), si = document.getElementById("qSec"), m = Math.floor(S.quick.secs / 60);
      mi.value = m; si.value = pad(S.quick.secs % 60); sizeDigits();
      return;
    }
    if(t.dataset && (t.dataset.f === "min" || t.dataset.f === "sec")){
      var x = S.plan[+t.dataset.i]; if(!x) return;
      var row = t.closest(".row");
      row.querySelector('[data-f="min"]').value = Math.floor(x.secs / 60);
      row.querySelector('[data-f="sec"]').value = pad(x.secs % 60);
    }
  });
  app.addEventListener("focusin", function(e){ var t = e.target; if(t.matches && t.matches("input.digit, input.mini")) setTimeout(function(){ try{ t.select(); }catch(err){} }, 0); });
  app.addEventListener("keydown", function(e){
    var t = e.target;
    if(e.key === "Enter" && t.id === "planName"){ e.preventDefault(); act("savePlan", {}); }
    if(e.key === "Enter" && (t.id === "qMin" || t.id === "qSec" || t.id === "qName")){ e.preventDefault(); t.blur(); readQuickTime(); if(S.quick.secs > 0) act("qStart", {}); }
  });
  document.addEventListener("keydown", function(e){
    var tag = (e.target.tagName || "").toLowerCase();
    if(tag === "input" || tag === "textarea") return;
    if(e.key === " " && onRunTab() && S.run.phase === "run"){ e.preventDefault(); S.run.endAt ? pause() : resume(); }
  });

  var toastTimer = null;
  function toast(msg){
    var t = document.getElementById("toast"); if(!t) return;
    t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  /* ---------- buttons ---------- */
  function arm(key){
    if(confirmKey === key){ confirmKey = null; clearTimeout(confirmTimer); return true; }
    confirmKey = key; clearTimeout(confirmTimer);
    confirmTimer = setTimeout(function(){ confirmKey = null; render(); }, 4000);
    render(); return false;
  }
  function act(a, d){
    var R = S.run;
    switch(a){
      case "tab": S.tab = d.v; save(); render(); return;
      case "goRun": if(R){ S.tab = R.mode === "plan" ? "plan" : "timer"; save(); render(); } return;
      case "qAdd": readQuickTime(); S.quick.secs = clampSecs(S.quick.secs + +d.v); save(); render(); return;
      case "qSet": S.quick.secs = clampSecs(+d.v); save(); render(); return;
      case "qStart": readQuickTime(); if(S.quick.secs > 0) startRun("quick", [{e: "", name: S.quick.name, secs: S.quick.secs}], 0); return;
      case "pause": pause(); return;
      case "resume": resume(); return;
      case "add": addTime(+d.v); return;
      case "restart": if(R) beginItem(R.idx); return;
      case "next": if(!R) return; if(hasNext()) beginItem(R.idx + 1); else { R.phase = "run"; finishItem(); } return;
      case "back": if(R && R.idx > 0) beginItem(R.idx - 1); return;
      case "jump": if(R) beginItem(+d.i); return;
      case "hold": if(R){ R.gapEnd = 0; save(); render(); } return;
      case "again": if(R) beginItem(R.idx); return;
      case "replan": if(R) beginItem(0); return;
      case "stop": stopRun(); return;
      case "addRow": if(S.plan.length >= MAXROWS) return; S.plan.push({e: "", name: "", secs: 300}); save(); render(); focusLast(); return;
      case "common": var c = COMMON[+d.k]; if(c && S.plan.length < MAXROWS){ S.plan.push({e: c[0], name: c[1], secs: c[2] * 60}); save(); render(); toast("✅ Added " + c[0] + " " + c[1] + " (" + c[2] + " min) as activity " + S.plan.length); } return;
      case "up": var i = +d.i; if(i > 0){ var tmp = S.plan[i]; S.plan[i] = S.plan[i - 1]; S.plan[i - 1] = tmp; save(); render(); } return;
      case "down": var j = +d.i; if(j < S.plan.length - 1){ var tp = S.plan[j]; S.plan[j] = S.plan[j + 1]; S.plan[j + 1] = tp; save(); render(); } return;
      case "del": S.plan.splice(+d.i, 1); save(); render(); return;
      case "clearPlan": if(arm("clearPlan")){ S.plan = []; save(); render(); } return;
      case "pStart": var items = S.plan.filter(function(x){ return x.secs > 0; }); if(items.length) startRun("plan", items, 0); return;
      case "auto": S.auto = !S.auto; save(); render(); return;
      case "warn": S.warn = !S.warn; save(); render(); return;
      case "savePlan":
        if(!S.plan.length) return;
        var inp = document.getElementById("planName"), nm = (inp && inp.value.trim()) || "My plan " + (S.plans.length + 1);
        var k = S.plans.findIndex ? S.plans.findIndex(function(p){ return p.name.toLowerCase() === nm.toLowerCase(); }) : -1;
        var copy = {name: nm.slice(0, 40), items: cleanItems(S.plan)};
        if(k > -1) S.plans[k] = copy; else S.plans.unshift(copy);
        S.plans = S.plans.slice(0, 30); save(); render(); toast(k > -1 ? "✅ Updated the saved plan: " + copy.name : "✅ Saved: " + copy.name); return;
      case "loadPlan": var p = S.plans[+d.k]; if(p){ S.plan = cleanItems(p.items); save(); render(); window.scrollTo(0, 0); toast("📂 Opened: " + p.name); } return;
      case "delPlan": if(arm("delPlan" + d.k)){ S.plans.splice(+d.k, 1); save(); render(); } return;
      case "wStart": var W = S.watch; unlockAudio(); W.running = true; W.startAt = Date.now(); save(); updateWake(); render(); return;
      case "wPause": var W2 = S.watch; W2.acc += Date.now() - W2.startAt; W2.running = false; save(); updateWake(); render(); return;
      case "wLap": if(S.watch.running){ S.watch.laps.push(watchSecs()); S.watch.laps = S.watch.laps.slice(-99); save(); render(); } return;
      case "wReset": S.watch = {running: false, startAt: 0, acc: 0, laps: []}; save(); updateWake(); render(); return;
    }
  }
  function focusLast(){ var ins = app.querySelectorAll('input[data-f="name"]'); if(ins.length) try{ ins[ins.length - 1].focus(); }catch(e){} }
  document.addEventListener("click", function(e){
    var b = e.target.closest("button"); if(!b || b.disabled) return;
    var d = b.dataset;
    if(d.size){ S.size = +d.size; save(); render(); return; }
    if(d.act === "sound"){ S.sound = !S.sound; if(S.sound){ tone(660, 0, 0.15, "triangle", 0.2); scheduleRun(); } else cancelSched(); save(); render(); return; }
    if(d.act === "fs"){ if(window.__toggleFS) window.__toggleFS(); return; }
    if(d.act){ unlockAudio(); if(S.run && !S.run.sched && d.act !== "pause" && d.act !== "stop") setTimeout(function(){ if(S.run && !S.run.sched) scheduleRun(); }, 0); if(confirmKey && d.act !== "clearPlan" && d.act.indexOf("delPlan") !== 0){ confirmKey = null; } act(d.act, d); }
  });

  load();
  if(S.run) S.run.sched = false;
  if(S.run && S.run.phase === "run" && S.run.endAt && S.run.endAt <= Date.now()){ S.run.phase = "up"; S.run.overAt = S.run.endAt; S.run.endAt = 0; S.run.gapEnd = 0; }
  render(); updateWake();
})();
</script>
<script>
/* full screen helper: works on desktop, Android and iPad (Safari), hides the button where full screen is not possible (iPhone) */
(function(){
  var d = document, el = d.documentElement;
  function canFS(){ return !!(d.fullscreenEnabled || d.webkitFullscreenEnabled) && !!(el.requestFullscreen || el.webkitRequestFullscreen); }
  window.__toggleFS = function(){
    try{
      if(!(d.fullscreenElement || d.webkitFullscreenElement)){
        var r = el.requestFullscreen ? el.requestFullscreen() : el.webkitRequestFullscreen();
        if(r && r.catch) r.catch(function(){});
      } else {
        var x = d.exitFullscreen ? d.exitFullscreen() : d.webkitExitFullscreen();
        if(x && x.catch) x.catch(function(){});
      }
    }catch(err){}
  };
  function hide(){ if(canFS()) return; d.querySelectorAll('[data-act="fs"],#fsBtn').forEach(function(b){ b.style.display = "none"; }); }
  hide();
  try{ new MutationObserver(hide).observe(d.body, {childList:true, subtree:true}); }catch(e){}
})();
</script>
<script>
/* toolkit home button: folder on a computer, same GitHub repository, or the teachers-toolkit repository */
(function(){
  var a = document.getElementById("toolkitHome"); if(!a) return;
  var REL = "Teachers_Toolkit_Home.html", REPOS = ["/teacherstoolkit/", "/teachers-toolkit/"];
  if(location.protocol === "file:"){ a.href = REL; return; }
  var gh = location.hostname.indexOf("github.io") > -1;
  a.href = gh ? REPOS[0] : REL;
  try{
    var head = function(u){ return fetch(u, {method:"HEAD", cache:"no-store"}).then(function(r){ return r.ok; }).catch(function(){ return false; }); };
    var tryAll = function(list, i){
      if(i >= list.length){ if(gh) a.href = REPOS[0]; return; }
      head(list[i]).then(function(y){ if(y) a.href = list[i]; else tryAll(list, i + 1); });
    };
    tryAll([REL].concat(REPOS), 0);
  }catch(e){}
})();
</script>
